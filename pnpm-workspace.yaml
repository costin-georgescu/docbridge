packages:
  - "apps/*"
  - "packages/*"
  - "infra"
  - "tests/*"
overrides:
  # GHSA-q7qp-rjg7-q26m (high): @nestjs/platform-express@12.2.0 pins
  # multer@2.4.0; no app code parses multipart bodies, but the vulnerable
  # package ships in every service image. Drop the override once the
  # @nestjs/* bump to >=12.3 (which pins 2.5.0) has some bake time.
  multer: "2.5.0"
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  unrs-resolver: true
  argon2: true
  "@prisma/engines": true
  prisma: true
